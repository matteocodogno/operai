# meetings-eval — prompt-injection evals for meetings-api (specs/021 T84, AC-7.12, AC-9.7, ADR-0067).
#
# CI MODE ONLY. This job runs the evals against the scripted fake model: no network, no database,
# no secrets (the workflow token is read-only and no `secrets.*` is referenced). The `--live` run
# against the real EU model (Claude on Vertex AI) is meetings-eval-live.yml and a documented RELEASE
# STEP (meetings-api/README.md § Prompt-injection evals) that needs cloud credentials; it must never be
# added here. The guard step below fails the job if cloud credentials or provider configuration ever
# appear in this job's environment.
#
# Like the other path-filtered workflows here, this is a real pre-merge gate only once a
# required-status-check rule names the job on `main` (a human decision, see infra/README.md).
name: meetings-eval

on:
  pull_request:
    paths:
      - "meetings-api/**"
      - ".github/workflows/meetings-eval.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: meetings-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: prompt-injection evals (fake model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: meetings-api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Same Bun line as meetings-api/Dockerfile (oven/bun:1.4); exact patch for reproducibility.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Guard — no cloud credentials in the job
        run: |
          set -eu
          # Google (the providers, specs/021 plan G-7), plus the previous providers' and generic names, so a
          # credential of any cloud cannot ride into this job. AZURE_EXTENSION_DIR is exempt: the runner
          # image itself sets it (a path to the az CLI extensions, no credential).
          hits="$(env | grep -E '^(MEETINGS_GCP_|MEETINGS_VERTEX_|MEETINGS_SPEECH_|GOOGLE_|CLOUDSDK_|ANTHROPIC_|AWS_|AZURE_)' | grep -v '^AZURE_EXTENSION_DIR=' | cut -d= -f1 || true)"
          if [ -n "${hits}" ]; then
            echo "${hits}"
            echo "::error::cloud credentials are present in the eval job; the live run is a release step, never CI"
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prompt-injection evals (fake model)
        run: bun evals/run.ts
      - name: Eval gate tests
        run: bun test evals
