services:
  postgres:
    image: docker.io/postgres:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - operai_postgres_data:/var/lib/postgresql/data

  # ─── estimai-api ────────────────────────────────────────────────────────────
  # Bun + Hono resource server for estimate persistence.
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see estimai-api/railway.json). Locally it runs against the shared Postgres
  # instance above. Request/response bodies are never written to application logs
  # (hono/logger emits method+path+status only — enforced in src/index.ts).
  #
  # Prerequisites:
  #   1. Copy estimai-api/.env.example → estimai-api/.env and fill in values.
  #   2. The `estimai` database must exist; run migrations first:
  #        docker compose run --rm estimai-api-migrate
  #      or manually:
  #        cd estimai-api && bun run db:migrate
  estimai-api:
    build:
      context: ./estimai-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8080:8080"
    env_file:
      - ./estimai-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The .env file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/estimai
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── notify-api ─────────────────────────────────────────────────────────────
  # Bun + Hono resource server for the notification center (specs/005).
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see notify-api/railway.json). Locally it runs against the shared Postgres
  # instance above, in its own logical database ('notify'). Same pattern as
  # 'estimai' above: there is no init script — Prisma creates the logical
  # database itself the first time migrations run against it (`migrate dev` /
  # `migrate deploy`, see `mise run db:migrate`), because the default
  # postgres/postgres role has CREATEDB. Request/response bodies are never
  # written to application logs (hono/logger emits method+path+status only —
  # enforced in src/index.ts) — notification title/body may name clients/estimates.
  #
  # Prerequisites:
  #   1. Copy notify-api/.env.example → notify-api/.env and fill in values.
  #   2. The `notify` database must exist; run migrations first:
  #        cd notify-api && bun run db:migrate
  #      or `mise run db:migrate` (applies auth + estimai-api + notify-api).
  notify-api:
    build:
      context: ./notify-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8081:8081"
    env_file:
      - ./notify-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The .env file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/notify
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── refund-api ─────────────────────────────────────────────────────────────
  # Bun + Hono resource server for the reimbursement tool (specs/007).
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see refund-api/railway.json). Locally it runs against the shared Postgres
  # instance above, in its own logical database ('refund'). Same pattern as
  # 'estimai'/'notify' above — no init script; Prisma creates the logical
  # database itself the first time migrations run (`migrate dev` / `migrate
  # deploy`). Request/response bodies are never written to application logs
  # (hono/logger emits method+path+status only, enforced in src/index.ts) —
  # this service additionally handles financial figures and receipt-attachment
  # metadata that may carry PII (ADR-0016). Receipt BYTES themselves never
  # transit this container — they go direct-to-bucket via presigned URLs
  # (REFUND_S3_*, a separate EU-region object-storage resource, ADR-0016).
  #
  # Prerequisites:
  #   1. Copy refund-api/.env.example → refund-api/.env and fill in values.
  #   2. The `refund` database must exist; run migrations first:
  #        cd refund-api && bun run db:migrate
  #      or `mise run db:migrate` (applies auth + estimai-api + notify-api +
  #      refund-api).
  refund-api:
    build:
      context: ./refund-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8082:8082"
    env_file:
      - ./refund-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The .env file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/refund
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── minio (local S3-compatible object storage) ─────────────────────────────
  # LOCAL-DEV-ONLY stand-in for the production EU-region bucket refund-api uses
  # for receipt attachments (ADR-0016). S3-compatible, path-style addressing
  # (refund-api/src/lib/storage.ts auto-enables forcePathStyle for any non-AWS
  # endpoint); buckets are PRIVATE by default — matching the "bucket must be
  # private, receipts served only via presigned URLs" requirement. In
  # production this is a REAL EU-region bucket (Railway EU Amsterdam / AWS
  # eu-south-1 / Scaleway), NEVER this container.
  #
  # IMPORTANT — run refund-api on the HOST (`mise run dev` / `cd refund-api &&
  # bun run dev`), not inside compose, when testing attachments: it must reach
  # MinIO at http://localhost:9000 so the presigned URLs it mints resolve
  # IDENTICALLY for both refund-api and the browser. A compose-internal
  # `minio:9000` host would break browser-side direct upload — a presigned
  # signature is bound to the exact endpoint host.
  #
  # refund-api/.env for local dev (all five REFUND_S3_* are required at startup):
  #   REFUND_S3_ENDPOINT=http://localhost:9000
  #   REFUND_S3_REGION=us-east-1                       # placeholder; MinIO ignores it
  #   REFUND_S3_BUCKET=operai-refund-attachments-dev
  #   REFUND_S3_ACCESS_KEY_ID=minioadmin
  #   REFUND_S3_SECRET_ACCESS_KEY=minioadmin
  #   REFUND_S3_EU_ENDPOINT_HOSTS=localhost            # residency guard allowlist —
  #     # required for a non-AWS endpoint, or refund-api process.exit(1)s at boot
  #     # (OWASP A05 fail-closed guard, refund-api/src/lib/s3Residency.ts).
  #
  # Console UI: http://localhost:9001 (login minioadmin / minioadmin).
  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - operai_minio_data:/data

  # One-shot: waits for MinIO, creates the dev bucket if absent, and asserts it
  # stays PRIVATE (no anonymous access), then exits. Re-running compose is
  # idempotent (`mb --ignore-existing`).
  minio-createbucket:
    image: docker.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...'; sleep 1;
      done &&
      mc mb --ignore-existing local/${REFUND_S3_BUCKET:-operai-refund-attachments-dev} &&
      mc anonymous set none local/${REFUND_S3_BUCKET:-operai-refund-attachments-dev} &&
      echo 'minio bucket ready (private): ${REFUND_S3_BUCKET:-operai-refund-attachments-dev}'
      "
    restart: "no"

volumes:
  operai_postgres_data:
    driver: local
  operai_minio_data:
    driver: local