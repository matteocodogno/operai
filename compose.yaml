services:
  postgres:
    image: docker.io/postgres:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - operai_postgres_data:/var/lib/postgresql/data

  # ─── estimai-api ────────────────────────────────────────────────────────────
  # Bun + Hono resource server for estimate persistence.
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see estimai-api/railway.json). Locally it runs against the shared Postgres
  # instance above. Request/response bodies are never written to application logs
  # (hono/logger emits method+path+status only — enforced in src/index.ts).
  #
  # Prerequisites:
  #   1. Copy estimai-api/.env.example → estimai-api/.env and fill in values.
  #   2. The `estimai` database must exist; run migrations first:
  #        docker compose run --rm estimai-api-migrate
  #      or manually:
  #        cd estimai-api && bun run db:migrate
  estimai-api:
    build:
      context: ./estimai-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8080:8080"
    env_file:
      - ./estimai-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The .env file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/estimai
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── notify-api ─────────────────────────────────────────────────────────────
  # Bun + Hono resource server for the notification center (specs/005).
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see notify-api/railway.json). Locally it runs against the shared Postgres
  # instance above, in its own logical database ('notify'). Same pattern as
  # 'estimai' above: there is no init script — Prisma creates the logical
  # database itself the first time migrations run against it (`migrate dev` /
  # `migrate deploy`, see `mise run db:migrate`), because the default
  # postgres/postgres role has CREATEDB. Request/response bodies are never
  # written to application logs (hono/logger emits method+path+status only —
  # enforced in src/index.ts) — notification title/body may name clients/estimates.
  #
  # Prerequisites:
  #   1. Copy notify-api/.env.example → notify-api/.env and fill in values.
  #   2. The `notify` database must exist; run migrations first:
  #        cd notify-api && bun run db:migrate
  #      or `mise run db:migrate` (applies auth + estimai-api + notify-api).
  notify-api:
    build:
      context: ./notify-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8081:8081"
    env_file:
      - ./notify-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The .env file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/notify
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── refund-api ─────────────────────────────────────────────────────────────
  # Bun + Hono resource server for the reimbursement tool (specs/007).
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see refund-api/railway.json). Locally it runs against the shared Postgres
  # instance above, in its own logical database ('refund'). Same pattern as
  # 'estimai'/'notify' above — no init script; Prisma creates the logical
  # database itself the first time migrations run (`migrate dev` / `migrate
  # deploy`). Request/response bodies are never written to application logs
  # (hono/logger emits method+path+status only, enforced in src/index.ts) —
  # this service additionally handles financial figures and receipt-attachment
  # metadata that may carry PII (ADR-0016). Receipt BYTES themselves never
  # transit this container — they go direct-to-bucket via presigned URLs
  # (REFUND_S3_*, a separate EU-region object-storage resource, ADR-0016).
  #
  # Prerequisites:
  #   1. Copy refund-api/.env.example → refund-api/.env and fill in values.
  #   2. The `refund` database must exist; run migrations first:
  #        cd refund-api && bun run db:migrate
  #      or `mise run db:migrate` (applies auth + estimai-api + notify-api +
  #      refund-api).
  refund-api:
    build:
      context: ./refund-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8082:8082"
    env_file:
      - ./refund-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The .env file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/refund
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  operai_postgres_data:
    driver: local