services:
  postgres:
    image: docker.io/postgres:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operai"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - operai_postgres_data:/var/lib/postgresql/data

volumes:
  operai_postgres_data:
    driver: local