# `auth` is deliberately NOT a service of this file: it runs on the host (`mise run dev`, or `bun run dev` in auth/) and takes its
# settings from its own dotenv file, which is also what the e2e stack's auth uses. So the e2e-only raise of the legal-entity write
# limit (LEGAL_ENTITY_WRITE_RATE_LIMIT, specs/20261117-legal-entities T67, security review F3) lives in auth/.env.example, not here;
# nothing in this file can change a deployed environment's limit (production keeps the default, 10).

services:
  postgres:
    image: docker.io/postgres:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - operai_postgres_data:/var/lib/postgresql/data

  # ─── estimai-api ────────────────────────────────────────────────────────────
  # Bun + Hono resource server for estimate persistence.
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see .railway/railway.ts, service estimai-api). Locally it runs against the shared Postgres
  # instance above. Request/response bodies are never written to application logs
  # (hono/logger emits method+path+status only — enforced in src/index.ts).
  #
  # Prerequisites:
  #   1. Copy estimai-api/.env.example → estimai-api/.env and fill in values.
  #   2. The `estimai` database must exist; run migrations first:
  #        docker compose run --rm estimai-api-migrate
  #      or manually:
  #        cd estimai-api && bun run db:migrate
  estimai-api:
    build:
      context: ./estimai-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8080:8080"
    env_file:
      - ./estimai-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The .env file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/estimai
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── notify-api ─────────────────────────────────────────────────────────────
  # Bun + Hono resource server for the notification center (specs/20260713-notification-center).
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see .railway/railway.ts, service notify-api). Locally it runs against the shared Postgres
  # instance above, in its own logical database ('notify'). Same pattern as
  # 'estimai' above: there is no init script — Prisma creates the logical
  # database itself the first time migrations run against it (`migrate dev` /
  # `migrate deploy`, see `mise run db:migrate`), because the default
  # postgres/postgres role has CREATEDB. Request/response bodies are never
  # written to application logs (hono/logger emits method+path+status only —
  # enforced in src/index.ts) — notification title/body may name clients/estimates.
  #
  # Prerequisites:
  #   1. Copy notify-api/.env.example → notify-api/.env and fill in values.
  #   2. The `notify` database must exist; run migrations first:
  #        cd notify-api && bun run db:migrate
  #      or `mise run db:migrate` (applies auth + estimai-api + notify-api).
  notify-api:
    build:
      context: ./notify-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8081:8081"
    env_file:
      - ./notify-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The .env file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/notify
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── refund-api ─────────────────────────────────────────────────────────────
  # Bun + Hono resource server for the reimbursement tool (specs/20260716-refund-service).
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see .railway/railway.ts, service refund-api). Locally it runs against the shared Postgres
  # instance above, in its own logical database ('refund'). Same pattern as
  # 'estimai'/'notify' above — no init script; Prisma creates the logical
  # database itself the first time migrations run (`migrate dev` / `migrate
  # deploy`). Request/response bodies are never written to application logs
  # (hono/logger emits method+path+status only, enforced in src/index.ts) —
  # this service additionally handles financial figures and receipt-attachment
  # metadata that may carry PII (ADR 20260716-eu-object-storage-refund-attachments). Receipt BYTES themselves never
  # transit this container — they go direct-to-bucket via presigned URLs
  # (REFUND_S3_*, a separate EU-region object-storage resource, ADR 20260716-eu-object-storage-refund-attachments).
  #
  # Prerequisites:
  #   1. Copy refund-api/.env.example → refund-api/.env and fill in values.
  #   2. The `refund` database must exist; run migrations first:
  #        cd refund-api && bun run db:migrate
  #      or `mise run db:migrate` (applies auth + estimai-api + notify-api +
  #      refund-api).
  refund-api:
    build:
      context: ./refund-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8082:8082"
    env_file:
      - ./refund-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The .env file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/refund
      # specs/20261119-accounting: refund-api requires ACCOUNTING_INTERNAL_URL (it exits 1 without it). Inside compose,
      # accounting-api is reached by its service name (the dotenv value, localhost:8089, is the HOST address). Its
      # service client also needs the scope `accounting.reference.read` in auth's SERVICE_CLIENTS (`users.contact` only for a production release window, T84).
      ACCOUNTING_INTERNAL_URL: http://accounting-api:8089
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── inventory-api ──────────────────────────────────────────────────────────
  # Bun + Hono resource server for the hardware inventory and depreciation
  # register (specs/20261006-hardware-inventory).
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see .railway/railway.ts, service inventory-api). Locally it runs against the shared
  # Postgres instance above, in its own logical database ('inventory'). Same
  # pattern as 'estimai'/'notify'/'refund' above — no init script; Prisma
  # creates the logical database itself the first time migrations run
  # (`migrate dev` / `migrate deploy`). Request/response bodies are never
  # written to application logs (method+path+status only, enforced in
  # src/lib/logger.ts) — this service handles financial figures and personal
  # data (who holds which device). Invoice files go direct-to-bucket via
  # presigned URLs (INVENTORY_S3_*, its own EU-region bucket).
  #
  # Prerequisites:
  #   1. Copy inventory-api/.env.example to inventory-api/.env and fill in values.
  #   2. Run migrations first:
  #        cd inventory-api && bun run db:migrate
  #      or `mise run db:migrate` (applies all backends, inventory-api included).
  #
  # As with refund-api, run it on the HOST (`mise run dev`) when testing
  # invoice uploads: presigned URLs are bound to the endpoint host MinIO is
  # reached at (http://localhost:9000).
  inventory-api:
    build:
      context: ./inventory-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8083:8083"
    env_file:
      - ./inventory-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The .env file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/inventory
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── projects-api ───────────────────────────────────────────────────────────
  # Bun + Hono resource server for the projects module: projects, their contracts
  # and the project team (specs/20261103-projects).
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see .railway/railway.ts, service projects-api). Locally it runs against the shared Postgres
  # instance above, in its own logical database ('projects'). Same pattern as
  # 'estimai'/'notify'/'refund'/'inventory' above — no init script; Prisma
  # creates the logical database itself the first time migrations run
  # (`migrate dev` / `migrate deploy`). Request/response bodies are never
  # written to application logs (method+path+status only, enforced in
  # src/lib/logger.ts) — this service holds delivery terms, purchase orders and the ids of the
  # people on each project.
  #
  # Prerequisites:
  #   1. Fill in projects-api/.env (template: projects-api/.env.example).
  #   2. Run migrations first:
  #        cd projects-api && bun run db:deploy
  #      or `mise run db:migrate` (applies all backends, projects-api included).
  #   3. The test suite uses a SEPARATE database, `projects_test` (it truncates
  #      tables): create it once, then migrate it —
  #        docker compose exec postgres createdb -U postgres projects_test
  #        cd projects-api && DATABASE_URL=postgresql://postgres:postgres@localhost:5435/projects_test bun run db:deploy
  #
  # As with refund-api, prefer running it on the HOST (`mise run dev`): its
  # AUTH_JWKS_URL / AUTH_BASE_URL / CRM_INTERNAL_URL point at the other
  # services on localhost, which a container cannot reach by that name.
  projects-api:
    build:
      context: ./projects-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8086:8086"
    env_file:
      - ./projects-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The .env file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/projects
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── activities-api ─────────────────────────────────────────────────────────
  # Bun + Hono resource server holding the activities, tasks and blockers of the CRM and of
  # the projects module (specs/20261110-activities, ADR 20261110-activities-service-access-delegated-to-host/0082/0083). It owns no permission
  # catalog: every read and write asks the record's host (crm-api, projects-api) "may this
  # user ..." with the caller's own JWT and fails closed.
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see .railway/railway.ts, service activities-api). Locally it runs against the shared Postgres
  # instance above, in its own logical database ('activities'). Same pattern as
  # 'estimai'/'notify'/'refund'/'inventory'/'projects' above — no init script; Prisma
  # creates the logical database itself the first time migrations run
  # (`migrate dev` / `migrate deploy`). Request/response bodies are never
  # written to application logs (method+path+status only) — activities carry
  # notes about clients and the ids of the people involved.
  #
  # Prerequisites:
  #   1. Fill in activities-api/.env (template: activities-api/.env.example).
  #   2. Run migrations first:
  #        cd activities-api && bun run db:deploy
  #      or `mise run db:migrate` (applies all backends, activities-api included).
  #   3. The test suite uses a SEPARATE database, `activities_test` (it truncates
  #      tables): create it once, then migrate it —
  #        docker compose exec postgres createdb -U postgres activities_test
  #        cd activities-api && DATABASE_URL=postgresql://postgres:postgres@localhost:5435/activities_test bun run db:deploy
  #
  # As with projects-api, prefer running it on the HOST (`mise run dev`): its
  # AUTH_JWKS_URL / AUTH_BASE_URL / CRM_API_URL / PROJECTS_API_URL / NOTIFY_INTERNAL_URL
  # point at the other services on localhost, which a container cannot reach by that name.
  activities-api:
    build:
      context: ./activities-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8087:8087"
    env_file:
      - ./activities-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The .env file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/activities
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── letterhead-api ─────────────────────────────────────────────────────────
  # Rust (axum) service that lays out a whole document, Typst embedded as a library, for every tool
  # (specs/20261116-letterhead-service, ADR 20261116-letterhead-api-is-a-rust-service-with-typst-embedded-for-document-layout-only). The one backend that is not Bun.
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region (europe-west4) with an EU
  # bucket. Locally it uses the shared Postgres above in its own logical database ('letterhead', created by
  # the one-shot below: sqlx, unlike Prisma, does not create it) and MinIO's private bucket 'letterhead'.
  # The startup residency guard runs here too: MinIO is "EU" only because LETTERHEAD_S3_EU_ENDPOINT_HOSTS says
  # so. It keeps no document content, PDF or image after a render, and logs identifiers and numbers only.
  #
  # No env file is needed: every variable has its local value below (an exported variable wins). It reaches
  # `auth` on the host through host.docker.internal; run the whole suite on the host with `mise run dev`
  # (which runs it as `mise run dev:letterhead`) when testing against a running auth.
  #
  # The image has no curl or wget: its HEALTHCHECK is `letterhead-api healthcheck`.
  letterhead-createdb:
    image: docker.io/postgres:${POSTGRES_VERSION:-17}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U ${POSTGRES_USER:-postgres} -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'letterhead'" | grep -q 1 \
          || psql -h postgres -U ${POSTGRES_USER:-postgres} -d postgres -c 'CREATE DATABASE letterhead'
    restart: "no"

  # One-shot: applies the migrations embedded in the image (`letterhead-api migrate`) and exits. It reads
  # DATABASE_URL and nothing else. `letterhead-api` never migrates and refuses to start on a database that is
  # not, so it waits for this to complete (amendment 2026-11-17 to the plan, item 4). On Railway the same
  # command is the service's `preDeploy` (`.railway/railway.ts`, task T13).
  letterhead-api-migrate:
    build:
      context: ./letterhead-api
      dockerfile: Dockerfile
      target: production
    command: ["letterhead-api", "migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/letterhead
    depends_on:
      postgres:
        condition: service_healthy
      letterhead-createdb:
        condition: service_completed_successfully
    # The image's HEALTHCHECK asks a server that this container does not run.
    healthcheck:
      disable: true
    restart: "no"

  letterhead-api:
    build:
      context: ./letterhead-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8088:8088"
    environment:
      PORT: "8088"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/letterhead
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:3001}
      AUTH_JWKS_URL: ${LETTERHEAD_AUTH_JWKS_URL:-http://host.docker.internal:3001/auth/jwks}
      AUTH_BASE_URL: ${LETTERHEAD_AUTH_BASE_URL:-http://host.docker.internal:3001}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-operai-suite}
      SERVICE_AUDIENCE: ${SERVICE_AUDIENCE:-operai-service}
      # Its own client at `auth` (specs/20261117-legal-entities): scope `legal-entities:read`, how it reads the issuer's
      # details itself. Not the SERVICE_CLIENT_* of the shell, which are another service's. The local secret must be the
      # one of the `letterhead-api` entry in auth's SERVICE_CLIENTS (32 to 256 characters).
      SERVICE_CLIENT_ID: ${LETTERHEAD_SERVICE_CLIENT_ID:-letterhead-api}
      SERVICE_CLIENT_SECRET: ${LETTERHEAD_SERVICE_CLIENT_SECRET:-local-letterhead-api-client-secret-0000}
      ALLOWED_ORIGINS: ${LETTERHEAD_ALLOWED_ORIGINS:-http://localhost:5173}
      LETTERHEAD_S3_ENDPOINT: http://minio:9000
      LETTERHEAD_S3_REGION: us-east-1 # placeholder; MinIO ignores it
      LETTERHEAD_S3_BUCKET: ${LETTERHEAD_S3_BUCKET:-letterhead}
      LETTERHEAD_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LETTERHEAD_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LETTERHEAD_S3_EU_ENDPOINT_HOSTS: minio # residency guard allowlist (non-AWS endpoint)
      LH_WORKERS: ${LH_WORKERS:-2}
      LH_QUEUE: ${LH_QUEUE:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      letterhead-api-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "letterhead-api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── accounting-api ─────────────────────────────────────────────────────────
  # Bun + Hono resource server holding the ledger accounts, VAT codes and monthly exchange rates per legal entity, which the
  # Refund tool reads live (specs/20261119-accounting, ADR 20261119-accounting-reference-data-belongs-to-accounting-api-…).
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see .railway/railway.ts, service accounting-api). Locally it runs against the shared Postgres
  # instance above, in its own logical database ('accounting'), made by the idempotent one-shot below (like
  # 'letterhead', unlike the Prisma-created ones above, so a fresh volume does not depend on `migrate deploy` creating it).
  # Request/response bodies are never written to application logs (method+path+status only).
  #
  # Prerequisites:
  #   1. Fill in accounting-api/.env (template: accounting-api/.env.example).
  #   2. Run migrations first:
  #        docker compose run --rm accounting-createdb && (cd accounting-api && bun run db:deploy)
  #      or `mise run db:migrate` (applies all backends, accounting-api included).
  #   3. The test suite truncates tables: run it on a throwaway database (an isolated container), never on this one.
  #
  # As with projects-api, prefer running it on the HOST (`mise run dev`): its AUTH_JWKS_URL / AUTH_BASE_URL point at
  # auth on localhost, which a container cannot reach by that name.
  accounting-createdb:
    image: docker.io/postgres:${POSTGRES_VERSION:-17}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U ${POSTGRES_USER:-postgres} -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'accounting'" | grep -q 1 \
          || psql -h postgres -U ${POSTGRES_USER:-postgres} -d postgres -c 'CREATE DATABASE accounting'
    restart: "no"

  accounting-api:
    build:
      context: ./accounting-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8089:8089"
    env_file:
      - ./accounting-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The dotenv file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/accounting
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      accounting-createdb:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── hours-api ──────────────────────────────────────────────────────────────
  # Bun + Hono resource server for time tracking: the hours people record on a project, a deal,
  # a meeting or other work, the categories and work types they pick from, and the oversight view
  # for holders of `time-entry:read-all` (specs/029-time-tracking, ADR-0088/0089/0090). It owns no
  # access list of the records an entry points at: every "may this person book on ..." is asked of
  # the owner (projects-api, crm-api, activities-api, meetings-api) with the caller's own JWT and
  # fails closed on a write.
  #
  # DATA-RESIDENCY: in production this service is deployed to Railway EU region
  # (see hours-api/railway.json). Locally it runs against the shared Postgres
  # instance above, in its own logical database ('hours'). Same pattern as
  # 'estimai'/'notify'/'refund'/'inventory'/'projects'/'activities' above — no init script;
  # Prisma creates the logical database itself the first time migrations run
  # (`migrate dev` / `migrate deploy`). Request/response bodies and query strings are never
  # written to application logs (method+path+status only, enforced in src/lib/logger.ts) —
  # this service holds personal data about workers: which day each person spent how long on what.
  #
  # Prerequisites:
  #   1. Fill in hours-api/.env (template: hours-api/.env.example) — or, for `mise run dev`,
  #      hours-api/.envrc, which a person creates (agents may not) and allows with
  #      `direnv allow hours-api`.
  #   2. Run migrations first:
  #        cd hours-api && bun run db:deploy
  #      or `mise run db:migrate` (applies all backends, hours-api included).
  #   3. The test suite uses a SEPARATE database, `hours_test` (it truncates
  #      tables): create it once, then migrate it —
  #        docker compose exec postgres createdb -U postgres hours_test
  #        cd hours-api && DATABASE_URL=postgresql://postgres:postgres@localhost:5435/hours_test bun run db:deploy
  #
  # As with projects-api and activities-api, prefer running it on the HOST (`mise run dev`): its
  # AUTH_JWKS_URL / AUTH_BASE_URL / PROJECTS_API_URL / CRM_API_URL / ACTIVITIES_API_URL /
  # MEETINGS_API_URL point at the other services on localhost, which a container cannot reach by
  # that name.
  hours-api:
    build:
      context: ./hours-api
      dockerfile: Dockerfile
      target: production
    ports:
      - "8088:8088"
    env_file:
      - ./hours-api/.env
    environment:
      # Override DATABASE_URL so the hostname resolves inside the compose network.
      # The .env file uses localhost:5435 (host access); inside compose use the
      # service name 'postgres' on its internal port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hours
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── minio (local S3-compatible object storage) ─────────────────────────────
  # LOCAL-DEV-ONLY stand-in for the production EU-region bucket refund-api uses
  # for receipt attachments (ADR 20260716-eu-object-storage-refund-attachments). S3-compatible, path-style addressing
  # (refund-api/src/lib/storage.ts auto-enables forcePathStyle for any non-AWS
  # endpoint); buckets are PRIVATE by default — matching the "bucket must be
  # private, receipts served only via presigned URLs" requirement. In
  # production this is a REAL EU-region bucket (Railway EU Amsterdam / AWS
  # eu-south-1 / Scaleway), NEVER this container.
  #
  # IMPORTANT — run refund-api on the HOST (`mise run dev` / `cd refund-api &&
  # bun run dev`), not inside compose, when testing attachments: it must reach
  # MinIO at http://localhost:9000 so the presigned URLs it mints resolve
  # IDENTICALLY for both refund-api and the browser. A compose-internal
  # `minio:9000` host would break browser-side direct upload — a presigned
  # signature is bound to the exact endpoint host.
  #
  # refund-api/.env for local dev (all five REFUND_S3_* are required at startup):
  #   REFUND_S3_ENDPOINT=http://localhost:9000
  #   REFUND_S3_REGION=us-east-1                       # placeholder; MinIO ignores it
  #   REFUND_S3_BUCKET=operai-refund-attachments-dev
  #   REFUND_S3_ACCESS_KEY_ID=minioadmin
  #   REFUND_S3_SECRET_ACCESS_KEY=minioadmin
  #   REFUND_S3_EU_ENDPOINT_HOSTS=localhost            # residency guard allowlist —
  #     # required for a non-AWS endpoint, or refund-api process.exit(1)s at boot
  #     # (OWASP A05 fail-closed guard, refund-api/src/lib/s3Residency.ts).
  #
  # Console UI: http://localhost:9001 (login minioadmin / minioadmin).
  minio:
    image: docker.io/bitnamilegacy/minio:latest
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - operai_minio_data:/bitnami/minio/data

  # One-shot: waits for MinIO, creates the dev buckets (refund receipts +
  # inventory invoices + CRM files + activities files + letterhead logos and backgrounds + meetings audio) if absent, and asserts it
  # stays PRIVATE (no anonymous access), then exits. Re-running compose is
  # idempotent (`mb --ignore-existing`).
  #
  # The `meetings` bucket (specs/20261104-meetings, ADR 20261104-audio-retention-bucket-lifecycle-verified-at-startup) holds recorded audio only. It gets ONE
  # bucket-wide lifecycle rule (expire after 29 days, no prefix filter) and must never be
  # versioned: meetings-api refuses to start against a bucket without that rule or with
  # versioning Enabled. The rule is replaced on every run (`rm --all` then `add`) rather
  # than appended, because `ilm rule add` is not idempotent and a second run would leave
  # two rules. A bucket from an older volume that was versioned cannot be un-versioned:
  # the check above fails the one-shot instead of letting dev drift from production.
  minio-createbucket:
    image: docker.io/bitnamilegacy/minio-client:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...'; sleep 1;
      done &&
      mc mb --ignore-existing local/${REFUND_S3_BUCKET:-operai-refund-attachments-dev} &&
      mc anonymous set none local/${REFUND_S3_BUCKET:-operai-refund-attachments-dev} &&
      echo 'minio bucket ready (private): ${REFUND_S3_BUCKET:-operai-refund-attachments-dev}' &&
      mc mb --ignore-existing local/${INVENTORY_S3_BUCKET:-operai-inventory-invoices-dev} &&
      mc anonymous set none local/${INVENTORY_S3_BUCKET:-operai-inventory-invoices-dev} &&
      echo 'minio bucket ready (private): ${INVENTORY_S3_BUCKET:-operai-inventory-invoices-dev}' &&
      mc mb --ignore-existing local/${CRM_S3_BUCKET:-operai-crm-files-dev} &&
      mc anonymous set none local/${CRM_S3_BUCKET:-operai-crm-files-dev} &&
      echo 'minio bucket ready (private): ${CRM_S3_BUCKET:-operai-crm-files-dev}' &&
      mc mb --ignore-existing local/${ACTIVITIES_S3_BUCKET:-operai-activities-files-dev} &&
      mc anonymous set none local/${ACTIVITIES_S3_BUCKET:-operai-activities-files-dev} &&
      echo 'minio bucket ready (private): ${ACTIVITIES_S3_BUCKET:-operai-activities-files-dev}' &&
      mc mb --ignore-existing local/${LETTERHEAD_S3_BUCKET:-letterhead} &&
      mc anonymous set none local/${LETTERHEAD_S3_BUCKET:-letterhead} &&
      echo 'minio bucket ready (private): ${LETTERHEAD_S3_BUCKET:-letterhead}' &&
      mc mb --ignore-existing local/${MEETINGS_S3_BUCKET:-meetings} &&
      mc anonymous set none local/${MEETINGS_S3_BUCKET:-meetings} &&
      (mc ilm rule rm --all --force local/${MEETINGS_S3_BUCKET:-meetings} || true) &&
      mc ilm rule add --expire-days 29 local/${MEETINGS_S3_BUCKET:-meetings} &&
      if mc version info --json local/${MEETINGS_S3_BUCKET:-meetings} | grep -Eq '\"status\": ?\"Enabled\"'; then
        echo 'meetings bucket has versioning ENABLED - recreate the volume (docs: infra/README.md, Meetings)'; exit 1;
      fi &&
      echo 'minio bucket ready (private, audio expires after 29 days, versioning off): ${MEETINGS_S3_BUCKET:-meetings}'
      "
    restart: "no"

volumes:
  operai_postgres_data:
    driver: local
  operai_minio_data:
    driver: local