[tools]
node = "24"

[hooks]
postinstall = "corepack enable pnpm && corepack use pnpm@latest-10"

[settings]
experimental = true

# --- Release (Changesets — independent per-app SemVer + an aggregate `operai`
# umbrella version). See .changeset/README.md. Run `pnpm install` at the repo
# ROOT once so `@changesets/cli` is available (pnpm ignores the root's
# npm-style `workspaces`, so per-app installs/deploys are untouched). ---
[tasks.changeset]
description = "Record a changeset (which app(s) bump + why) — run when a feature lands"
run = "pnpm exec changeset"

[tasks."release:version"]
description = "Apply pending changesets: bump each app + the umbrella operai version + CHANGELOGs"
run = "node scripts/version.mjs"

[tasks."release:tag"]
description = "Tag a versioned+committed release (per-app + operai@x.y.z); review, then git push --follow-tags"
run = "node scripts/tag.mjs"

# --- env-doctor: validate the suite's cross-service env contract BEFORE deploy
# (Phase 1). Usage: `mise run env:doctor -- --env production --dir ./resolved`
# where <dir> holds one <service>.env per service (e.g. `op inject`ed). With no
# --dir it reads each <service>/.env locally. See tools/env-doctor/README.md. ---
[tasks."env:doctor"]
description = "Check cross-service env vars for a target env (shared/internal/public/CORS invariants)"
run = "bun tools/env-doctor/index.ts"

# Run the WHOLE Operai suite locally (Module Federation, specs/003 + specs/005
# + specs/007): Postgres + MinIO (local S3 for refund receipts) + all FOUR
# backends + the four tool frontends, one command. Ports: auth 3001,
# estimai-api 8080, notify-api 8081, refund-api 8082, shell 5173, estimai-ui
# 5174, refund-ui 5175, notify-ui 5176, admin-ui 5177 (frontend ports pinned in
# each app's vite.config.ts); MinIO S3 9000 + console 9001. Open
# http://localhost:5173 (the shell).
# `trap 'kill 0'` reaps every child (backends + vite) on Ctrl-C. Postgres +
# MinIO are left running (docker `up -d`, detached) — cheap to keep;
# `docker compose down` to stop them. The one-shot `minio-createbucket` creates
# the private dev bucket then exits (0). NOTE: the Dockerized backend services
# in compose.yaml are NOT started here — this task runs them via `bun` for HMR,
# so only the infra services (postgres, minio) are named on the compose line.
#
# Backend env: auth + estimai-api + notify-api + refund-api load their secrets
# from their own `.envrc` (direnv + 1Password — refund-api's own .envrc has no
# 1Password-sourced secrets yet, see refund-api/.envrc). The `direnv exec .`
# wrappers below load `auth/.envrc` / `estimai-api/.envrc` / `notify-api/.envrc`
# / `refund-api/.envrc` explicitly — mise runs the task non-interactively, so
# direnv's shell hook does NOT fire on its own (without this, the backends fall
# back to placeholder creds and e.g. Google OAuth fails with `invalid_client`).
# Prereqs (once): direnv installed; each backend's .envrc allowed (`direnv allow
# auth`, `direnv allow estimai-api`, `direnv allow notify-api`, `direnv allow
# refund-api`); 1Password CLI signed in; ENABLE_TEST_AUTH=true for a seeded
# local session; and migrations applied via `mise run db:migrate`.
#
# HMR note: all-dev Module Federation works (verified — remotes mount, shared
# React singleton holds, no dup-React). Editing a remote's MF-EXPOSED root
# (estimai-ui/refund-ui src/App.tsx) triggers a full page reload rather than
# state-preserving Fast Refresh (the `__mf_remote_dependency_pending` export the
# federation plugin adds is incompatible with React Fast Refresh's
# consistent-exports rule); edits deeper in a remote's tree Fast-Refresh normally.
[tasks.dev]
description = "Run the FULL suite locally with HMR — Postgres + MinIO (S3 :9000, console :9001) + auth :3001 + estimai-api :8080 + notify-api :8081 + refund-api :8082 + shell :5173 + estimai-ui :5174 + refund-ui :5175 + notify-ui :5176 + admin-ui :5177"
run = """
docker compose up -d postgres minio minio-createbucket
trap 'kill 0' EXIT INT TERM
(cd auth && direnv exec . bun run dev) &
(cd estimai-api && direnv exec . bun run dev) &
(cd notify-api && direnv exec . bun run dev) &
(cd refund-api && direnv exec . bun run dev) &
pnpm --dir shell dev &
pnpm --dir estimai-ui dev &
pnpm --dir refund-ui dev &
pnpm --dir admin-ui dev &
pnpm --dir notify-ui dev &
wait
"""

# Frontends only (HMR) — for when the backends are already running elsewhere
# (e.g. you started auth/estimai-api/notify-api/refund-api in their own terminals).
[tasks."dev:web"]
description = "Frontends only (HMR) — shell :5173 + estimai-ui :5174 + refund-ui :5175 + notify-ui :5176 + admin-ui :5177 (backends run separately)"
run = "trap 'kill 0' EXIT INT TERM; pnpm --dir shell dev & pnpm --dir estimai-ui dev & pnpm --dir refund-ui dev & pnpm --dir admin-ui dev & pnpm --dir notify-ui dev & wait"

# Full stack, but the frontends run build + preview instead of dev: no HMR, but
# deterministic and mirrors the Vercel deploy shape (independently built + served
# remotes) — the same mode the e2e uses (shell/playwright.config.ts). Builds gate
# the previews. Same prereqs + ports as `dev`.
[tasks."dev:preview"]
description = "Full suite, frontends build+preview (no HMR; mirrors deploy) — Postgres + MinIO + auth + estimai-api + notify-api + refund-api + built frontends"
run = """
docker compose up -d postgres minio minio-createbucket
pnpm --dir shell build && pnpm --dir estimai-ui build && pnpm --dir refund-ui build && pnpm --dir admin-ui build && pnpm --dir notify-ui build
trap 'kill 0' EXIT INT TERM
(cd auth && direnv exec . bun run dev) &
(cd estimai-api && direnv exec . bun run dev) &
(cd notify-api && direnv exec . bun run dev) &
(cd refund-api && direnv exec . bun run dev) &
pnpm --dir shell preview &
pnpm --dir estimai-ui preview &
pnpm --dir refund-ui preview &
pnpm --dir admin-ui preview &
pnpm --dir notify-ui preview &
wait
"""

# One-time / occasional: bring up Postgres and apply all four backends' Prisma
# migrations (non-interactive `migrate deploy`). Run this before the first
# `mise run dev` (or after pulling new migrations). refund-api has no
# migrations yet (T5 lands prisma/migrations/0001_init) — `db:deploy` against
# an empty migrations directory is a no-op, not an error, so this stays safe
# to run today.
[tasks."db:migrate"]
description = "Apply DB migrations for auth + estimai-api + notify-api + refund-api (needs backend env configured)"
run = """
docker compose up -d postgres
(cd auth && direnv exec . bun run db:deploy)
(cd estimai-api && direnv exec . bun run db:deploy)
(cd notify-api && direnv exec . bun run db:deploy)
(cd refund-api && direnv exec . bun run db:deploy)
"""