[tools]
node = "24"
# specs/20261116-letterhead-service (ADR 20261116-letterhead-api-is-a-rust-service-with-typst-embedded-for-document-layout-only): the one Rust service, letterhead-api/. Pinned EXACT,
# so CI, the Docker builder (letterhead-api/Dockerfile, ARG RUST_VERSION) and a developer's machine use the same compiler;
# change the three together. rustfmt and clippy are the service's format and lint gates (AGENTS.md, Rust service).
rust = { version = "1.100.0", components = "rustfmt,clippy" }

[hooks]
postinstall = "corepack enable pnpm && corepack use pnpm@latest-10"

[settings]
experimental = true

# --- Release (Changesets — independent per-app SemVer + an aggregate `operai`
# umbrella version). See .changeset/README.md. Run `pnpm install` at the repo
# ROOT once so `@changesets/cli` is available (pnpm ignores the root's
# npm-style `workspaces`, so per-app installs/deploys are untouched). ---
[tasks.changeset]
description = "Record a changeset (which app(s) bump + why) — run when a feature lands"
run = "pnpm exec changeset"

[tasks."release:version"]
description = "Apply pending changesets: bump each app + the umbrella operai version + CHANGELOGs"
run = "node scripts/version.mjs"

[tasks."release:tag"]
description = "Tag a versioned+committed release (per-app + operai@x.y.z); review, then git push --follow-tags"
run = "node scripts/tag.mjs"

# Local parity with .github/workflows/changeset-check.yml: does this branch's
# diff against main include a changeset for any app-code change? Run before
# pushing to catch a missing changeset before CI's push-trigger leg does (see
# the workflow file's header comment — that leg is a detector, not a gate).
[tasks."changeset:check"]
description = "Check this branch's diff against main for a missing changeset (local parity with CI's changeset-check)"
run = "node scripts/check-changeset.mjs --base=$(git merge-base HEAD main) --head=HEAD"

# Module Federation shares `react`/`react-dom` as singletons across the shell and
# every remote (ADR 20260709-suite-frontend-module-federation), yet each frontend is installed — and its lockfile
# resolved — on its own. A frontend whose lockfile resolves a different React
# builds and passes its own tests but breaks the assembled suite. This reads the
# lockfiles as text (no install, no network) and fails on any difference. Also
# run by .github/workflows/react-skew.yml. Self-test: `node --test scripts/check-react-skew.test.mjs`.
[tasks."react:skew"]
description = "Fail if the frontends' pnpm lockfiles resolve different react/react-dom versions (Module Federation singleton)"
run = "node scripts/check-react-skew.mjs"

# --- @operai/ui (operai-ui/, ADR 20261031-shared-ui-library-consumed-as-source): the shared design system. Apps compile
# its source, so a library change is checked in the library AND in every app
# that consumes it (today: the shell, for tokens.css, and refund-ui). ---
[tasks."ui:storybook"]
description = "Run the @operai/ui Storybook (components, foundations, page compositions) on http://localhost:6006"
dir = "operai-ui"
run = "pnpm install --frozen-lockfile && pnpm storybook"

[tasks."ui:check"]
description = "Check @operai/ui and its consumers: library typecheck/lint/tests/Storybook build, then shell + refund-ui + meetings-ui + hours-ui build and tests"
run = """
set -e
(cd operai-ui && pnpm typecheck && pnpm lint && pnpm test && pnpm build-storybook --quiet)
(cd shell && pnpm build && pnpm test)
(cd refund-ui && pnpm build && pnpm lint && pnpm test)
(cd meetings-ui && pnpm build && pnpm lint && pnpm test)
(cd hours-ui && pnpm build && pnpm lint && pnpm test)
"""

# --- Shared-copy drift guard: a few backend modules are COPIED between services
# (no shared package, by design). Each copy marks its shared region with
# `// shared-copy:begin|end <name>`; this fails, naming the files, when the regions
# differ. Registry + self-test: scripts/check-shared-copies.{ts,test.ts}. Also run by
# .github/workflows/shared-copies.yml. ---
[tasks."shared:check"]
description = "Fail if the deliberately duplicated backend modules (serviceToken, s3Residency, problem, logger copies) drifted apart"
run = "bun scripts/check-shared-copies.ts"

# --- Single-replica guard (specs/20261126-teams R12): fail if .railway/railway.ts gives a service that keeps state
# in process (projects-api, notify-api, meetings-api, letterhead-api, accounting-api) anything but one replica.
# Registry + self-test: scripts/check-single-replica.{ts,test.ts}. Also run by .github/workflows/railway-drift.yml. ---
[tasks."replicas:check"]
description = "Fail if .railway/railway.ts gives a single-replica service more (or fewer) than one replica"
run = "bun scripts/check-single-replica.ts"

# --- env-doctor: validate the suite's cross-service env contract BEFORE deploy
# (Phase 1). Usage: `mise run env:doctor -- --env production --dir ./resolved`
# where <dir> holds one <service>.env per service (e.g. `op inject`ed). With no
# --dir it reads each <service>/.env locally. See tools/env-doctor/README.md. ---
[tasks."env:doctor"]
description = "Check cross-service env vars for a target env (shared/internal/public/CORS invariants)"
run = "bun tools/env-doctor/index.ts"

# specs/20261110-activities: the shell reads the activities-api origin from VITE_ACTIVITIES_API_URL (trusted origin for the
# Bearer + the base URL crm-ui / projects-ui call). Defaulted here so a fresh checkout works without editing
# the shell's dotenv file; an exported value (or that file) still wins. Vite bakes it at BUILD time, so
# dev:preview exports it before the build too. VITE_LETTERHEADS_API_URL (specs/20261116-letterhead-service) is the same for
# letterhead-api (:8088), which letterheads-ui (:5182) reaches through the shell. VITE_ACCOUNTING_API_URL
# (specs/20261119-accounting) is the same for accounting-api (:8089), which accounting-ui (:5183) reaches through the shell.
#
# specs/20261112-time-tracking: likewise VITE_HOURS_API_URL (hours-api, :8090) — the base URL hours-ui calls (its
# Settings tab, the time lists, included) and the shell's trusted origin for the Bearer. Same default, same rule: set in `dev`,
# `dev:web` and `dev:preview`, and before the shell's build in the last one.
#
# Run the WHOLE Operai suite locally (Module Federation, specs/20260709-suite-shell + specs/20260713-notification-center
# + specs/20260716-refund-service + specs/20261006-hardware-inventory): Postgres + MinIO (local S3 for refund receipts and
# inventory invoices) + all the backends + all the tool frontends, one
# command. Ports: auth 3001, estimai-api 8080, notify-api 8081, refund-api
# 8082, inventory-api 8083, crm-api 8084, meetings-api 8085, projects-api 8086, activities-api 8087,
# hours-api 8090, shell 5173,
# estimai-ui 5174, refund-ui 5175, notify-ui 5176, admin-ui 5177, inventory-ui 5178, crm-ui 5179,
# meetings-ui 5180, projects-ui 5181, letterheads-ui 5182, accounting-ui 5183, hours-ui 5184 (frontend ports pinned in each app's vite.config.ts); letterhead-api 8088 (Rust, specs/20261116-letterhead-service);
# accounting-api 8089 (Bun, own database `accounting`, specs/20261119-accounting); MinIO S3
# 9000 + console 9001. Open
# http://localhost:5173 (the shell).
# `trap 'kill 0'` reaps every child (backends + vite) on Ctrl-C. Postgres +
# MinIO are left running (docker `up -d`, detached) — cheap to keep;
# `docker compose down` to stop them. The one-shot `minio-createbucket` creates
# the private dev bucket then exits (0). NOTE: the Dockerized backend services
# in compose.yaml are NOT started here — this task runs them via `bun` for HMR,
# so only the infra services (postgres, minio) are named on the compose line.
#
# letterhead-api needs no .envrc: `mise run dev:letterhead` carries the local values (see that task).
#
# accounting-api (specs/20261119-accounting) has its own `.envrc` like refund-api (`direnv allow accounting-api`; its dotenv file
# is copied from accounting-api's example file). Its logical database `accounting` is made by the compose one-shot
# `accounting-createdb` (named on the `docker compose up` lines below and run by `db:migrate`). refund-api now REQUIRES
# ACCOUNTING_INTERNAL_URL at startup (it exits 1 without it) and its service client must hold the scopes
# `accounting.reference.read` in auth's SERVICE_CLIENTS (`users.contact` only for a production release window, T84): the tasks below default the URL to accounting-api's local port for
# refund-api only, and a value in refund-api's own dotenv file wins.
#
# Backend env: auth + estimai-api + notify-api + refund-api + inventory-api load
# their secrets from their own `.envrc` (direnv + 1Password — refund-api's own .envrc has no
# 1Password-sourced secrets yet, see refund-api/.envrc). The `direnv exec .`
# wrappers below load `auth/.envrc` / `estimai-api/.envrc` / `notify-api/.envrc`
# / `refund-api/.envrc` / `inventory-api/.envrc` / `crm-api/.envrc` explicitly — mise runs the task non-interactively, so
# direnv's shell hook does NOT fire on its own (without this, the backends fall
# back to placeholder creds and e.g. Google OAuth fails with `invalid_client`).
#
# meetings-api (specs/20261104-meetings) has NO .envrc yet: its `direnv exec .` below loads nothing
# until one is added (mirror crm-api/.envrc: DATABASE_URL, AUTH_*, MEETINGS_S3_*, provider
# keys), so until then those variables must be in the calling shell.
#
# hours-api (specs/20261112-time-tracking) has no direnv file and needs none: a person copies
# hours-api/.env.example to hours-api/.env (gitignored — secret values live only there, never in a committed
# .envrc) and fills it; bun and prisma.config.ts load it, and `direnv exec .` below only adds the root env.
# Until it exists hours-api exits at start on its env validation (src/lib/env.ts, exit 1, naming each missing
# variable) and the rest of the stack keeps running; nothing answers on :8090. It also needs `SERVICE_AUDIENCE`
# in meetings-api's own environment and an `hours-api` entry (scope `meetings.hosts.read`) in auth's
# `SERVICE_CLIENTS`, its secret held where auth keeps the others (never a committed file): without them a
# meeting's deal reads as unavailable.
#
# Frontend env: admin-ui ALSO has its own `.envrc` (VITE_GOOGLE_MAPS_API_KEY,
# specs/20260803-employee-address / ADR 20260804-google-places-browser-direct-referrer-restricted-key) and so runs through `direnv exec .` too — note the
# `cd` is load-bearing: direnv keys off the CURRENT directory, so
# `pnpm --dir admin-ui` would leave the shell at the repo root and silently skip
# the .envrc. The other three frontends have no .envrc and stay on `pnpm --dir`.
#
# Prereqs (once): direnv installed; each backend's .envrc allowed (`direnv allow
# auth`, `direnv allow estimai-api`, `direnv allow notify-api`, `direnv allow
# refund-api`, `direnv allow inventory-api`, `direnv allow crm-api`, `direnv allow projects-api`, `direnv allow activities-api`;
# hours-api has none, it reads hours-api/.env) plus
# `direnv allow admin-ui`; 1Password CLI signed in;
# ENABLE_TEST_AUTH=true for a seeded local session; and migrations applied via
# `mise run db:migrate`.
#
# HMR note: all-dev Module Federation works (verified — remotes mount, shared
# React singleton holds, no dup-React). Editing a remote's MF-EXPOSED root
# (estimai-ui/refund-ui src/App.tsx) triggers a full page reload rather than
# state-preserving Fast Refresh (the `__mf_remote_dependency_pending` export the
# federation plugin adds is incompatible with React Fast Refresh's
# consistent-exports rule); edits deeper in a remote's tree Fast-Refresh normally.
[tasks.dev]
description = "Run the FULL suite locally with HMR — Postgres + MinIO (S3 :9000, console :9001) + auth :3001 + estimai-api :8080 + notify-api :8081 + refund-api :8082 + inventory-api :8083 + crm-api :8084 + meetings-api :8085 + projects-api :8086 + activities-api :8087 + letterhead-api :8088 + accounting-api :8089 + hours-api :8090 + shell :5173 + estimai-ui :5174 + refund-ui :5175 + notify-ui :5176 + admin-ui :5177 + inventory-ui :5178 + crm-ui :5179 + meetings-ui :5180 + projects-ui :5181 + letterheads-ui :5182 + accounting-ui :5183 + hours-ui :5184"
run = """
export VITE_ACTIVITIES_API_URL="${VITE_ACTIVITIES_API_URL:-http://localhost:8087}"
export VITE_LETTERHEADS_API_URL="${VITE_LETTERHEADS_API_URL:-http://localhost:8088}"
export VITE_ACCOUNTING_API_URL="${VITE_ACCOUNTING_API_URL:-http://localhost:8089}"
export VITE_HOURS_API_URL="${VITE_HOURS_API_URL:-http://localhost:8090}"
docker compose up -d postgres minio minio-createbucket letterhead-createdb accounting-createdb
trap 'kill 0' EXIT INT TERM
(cd auth && direnv exec . bun run dev) &
(cd estimai-api && direnv exec . bun run dev) &
(cd notify-api && direnv exec . bun run dev) &
(cd refund-api && ACCOUNTING_INTERNAL_URL="${ACCOUNTING_INTERNAL_URL:-http://localhost:8089}" direnv exec . bun run dev) &
(cd inventory-api && direnv exec . bun run dev) &
(cd crm-api && direnv exec . bun run dev) &
(cd meetings-api && direnv exec . bun run dev) &
(cd projects-api && direnv exec . bun run dev) &
(cd activities-api && direnv exec . bun run dev) &
(cd accounting-api && direnv exec . bun run dev) &
mise run dev:letterhead &
(cd hours-api && direnv exec . bun run dev) &
pnpm --dir shell dev &
pnpm --dir estimai-ui dev &
pnpm --dir refund-ui dev &
pnpm --dir inventory-ui dev &
pnpm --dir crm-ui dev &
pnpm --dir meetings-ui dev &
pnpm --dir projects-ui dev &
pnpm --dir letterheads-ui dev &
pnpm --dir accounting-ui dev &
pnpm --dir hours-ui dev &
(cd admin-ui && direnv exec . pnpm dev) &
pnpm --dir notify-ui dev &
node scripts/open-when-ready.mjs http://localhost:5173 http://localhost:3001/health &
wait
"""

# Frontends only (HMR) — for when the backends are already running elsewhere
# (e.g. you started auth/estimai-api/notify-api/refund-api/inventory-api in their own terminals).
[tasks."dev:web"]
description = "Frontends only (HMR) — shell :5173 + estimai-ui :5174 + refund-ui :5175 + notify-ui :5176 + admin-ui :5177 + inventory-ui :5178 + crm-ui :5179 + meetings-ui :5180 + projects-ui :5181 + letterheads-ui :5182 + accounting-ui :5183 + hours-ui :5184 (backends run separately)"
run = "export VITE_ACTIVITIES_API_URL=\"${VITE_ACTIVITIES_API_URL:-http://localhost:8087}\"; export VITE_LETTERHEADS_API_URL=\"${VITE_LETTERHEADS_API_URL:-http://localhost:8088}\"; export VITE_ACCOUNTING_API_URL=\"${VITE_ACCOUNTING_API_URL:-http://localhost:8089}\"; export VITE_HOURS_API_URL=\"${VITE_HOURS_API_URL:-http://localhost:8090}\"; trap 'kill 0' EXIT INT TERM; pnpm --dir shell dev & pnpm --dir estimai-ui dev & pnpm --dir refund-ui dev & pnpm --dir inventory-ui dev & pnpm --dir crm-ui dev & pnpm --dir meetings-ui dev & pnpm --dir projects-ui dev & pnpm --dir letterheads-ui dev & pnpm --dir accounting-ui dev & pnpm --dir hours-ui dev & (cd admin-ui && direnv exec . pnpm dev) & pnpm --dir notify-ui dev & node scripts/open-when-ready.mjs http://localhost:5173 & wait"

# Full stack, but the frontends run build + preview instead of dev: no HMR, but
# deterministic and mirrors the Vercel deploy shape (independently built + served
# remotes) — the same mode the e2e uses (shell/playwright.config.ts). Builds gate
# the previews. Same prereqs + ports as `dev`.
[tasks."dev:preview"]
description = "Full suite, frontends build+preview (no HMR; mirrors deploy) — Postgres + MinIO + auth + estimai-api + notify-api + refund-api + inventory-api + crm-api + meetings-api + projects-api + activities-api + letterhead-api + accounting-api + hours-api + built frontends"
run = """
export VITE_ACTIVITIES_API_URL="${VITE_ACTIVITIES_API_URL:-http://localhost:8087}"
export VITE_LETTERHEADS_API_URL="${VITE_LETTERHEADS_API_URL:-http://localhost:8088}"
export VITE_ACCOUNTING_API_URL="${VITE_ACCOUNTING_API_URL:-http://localhost:8089}"
export VITE_HOURS_API_URL="${VITE_HOURS_API_URL:-http://localhost:8090}"
docker compose up -d postgres minio minio-createbucket letterhead-createdb accounting-createdb
# admin-ui builds through direnv: Vite bakes `import.meta.env.VITE_*` at BUILD
# time, so without its .envrc here the preview bundle ships with no Maps key and
# address autocomplete degrades silently (AC-3.2, specs/20260803-employee-address) — invisibly.
pnpm --dir shell build && pnpm --dir estimai-ui build && pnpm --dir refund-ui build && pnpm --dir inventory-ui build && pnpm --dir crm-ui build && pnpm --dir meetings-ui build && pnpm --dir projects-ui build && pnpm --dir letterheads-ui build && pnpm --dir accounting-ui build && pnpm --dir hours-ui build && (cd admin-ui && direnv exec . pnpm build) && pnpm --dir notify-ui build
trap 'kill 0' EXIT INT TERM
(cd auth && direnv exec . bun run dev) &
(cd estimai-api && direnv exec . bun run dev) &
(cd notify-api && direnv exec . bun run dev) &
(cd refund-api && ACCOUNTING_INTERNAL_URL="${ACCOUNTING_INTERNAL_URL:-http://localhost:8089}" direnv exec . bun run dev) &
(cd inventory-api && direnv exec . bun run dev) &
(cd crm-api && direnv exec . bun run dev) &
(cd meetings-api && direnv exec . bun run dev) &
(cd projects-api && direnv exec . bun run dev) &
(cd activities-api && direnv exec . bun run dev) &
(cd accounting-api && direnv exec . bun run dev) &
mise run dev:letterhead &
(cd hours-api && direnv exec . bun run dev) &
pnpm --dir shell preview &
pnpm --dir estimai-ui preview &
pnpm --dir refund-ui preview &
pnpm --dir inventory-ui preview &
pnpm --dir crm-ui preview &
pnpm --dir meetings-ui preview &
pnpm --dir projects-ui preview &
pnpm --dir letterheads-ui preview &
pnpm --dir accounting-ui preview &
pnpm --dir hours-ui preview &
pnpm --dir admin-ui preview &
pnpm --dir notify-ui preview &
node scripts/open-when-ready.mjs http://localhost:5173 http://localhost:3001/health &
wait
"""

# --- letterhead-api (specs/20261116-letterhead-service, ADR 20261116-letterhead-api-is-a-rust-service-with-typst-embedded-for-document-layout-only): the Rust service on :8088, run on the HOST like the other
# backends. It has no .envrc: the local values are below, and an exported AUTH_* / SERVICE_AUDIENCE / LH_* wins.
# DATABASE_URL is always built from POSTGRES_* and the logical database `letterhead` (never taken from the
# environment, so a DATABASE_URL meant for another service cannot point it at that service's database).
# Needs `docker compose up -d postgres minio minio-createbucket letterhead-createdb` (`mise run dev` does it).
# Rust 1.100 comes from [tools]; the first run compiles the workspace. `cargo test --workspace` runs its tests. ---
[tasks."dev:letterhead"]
description = "Run letterhead-api (Rust) on :8088 against the local Postgres (db letterhead) and MinIO (bucket letterhead), with local defaults"
dir = "letterhead-api"
run = """
export PORT=8088
export DATABASE_URL="postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@localhost:5435/letterhead"
export AUTH_ISSUER="${AUTH_ISSUER:-http://localhost:3001}"
export AUTH_JWKS_URL="${AUTH_JWKS_URL:-http://localhost:3001/auth/jwks}"
export AUTH_BASE_URL="${AUTH_BASE_URL:-http://localhost:3001}"
export AUTH_AUDIENCE="${AUTH_AUDIENCE:-operai-suite}"
export SERVICE_AUDIENCE="${SERVICE_AUDIENCE:-operai-service}"
# Its own client at auth (specs/20261117-legal-entities, scope legal-entities:read): how it reads the issuer's details.
# Never the shell's SERVICE_CLIENT_ID / SECRET (another service's): only LETTERHEAD_SERVICE_CLIENT_* override. The local
# secret must be the one of the `letterhead-api` entry in auth's SERVICE_CLIENTS (32 to 256 characters).
export SERVICE_CLIENT_ID="${LETTERHEAD_SERVICE_CLIENT_ID:-letterhead-api}"
export SERVICE_CLIENT_SECRET="${LETTERHEAD_SERVICE_CLIENT_SECRET:-local-letterhead-api-client-secret-0000}"
export ALLOWED_ORIGINS="${ALLOWED_ORIGINS:-http://localhost:5173}"
export LETTERHEAD_S3_ENDPOINT=http://localhost:9000
export LETTERHEAD_S3_REGION=us-east-1
export LETTERHEAD_S3_BUCKET="${LETTERHEAD_S3_BUCKET:-letterhead}"
export LETTERHEAD_S3_ACCESS_KEY_ID="${MINIO_ROOT_USER:-minioadmin}"
export LETTERHEAD_S3_SECRET_ACCESS_KEY="${MINIO_ROOT_PASSWORD:-minioadmin}"
export LETTERHEAD_S3_EU_ENDPOINT_HOSTS=localhost
# `serve` never migrates and refuses to start on a database that is not (amendment 2026-11-17): apply them first.
cargo run -p letterhead-api -- migrate
exec cargo run -p letterhead-api
"""

# One-time / occasional: bring up Postgres and apply all six backends' Prisma
# migrations (non-interactive `migrate deploy`). Run this before the first
# `mise run dev` (or after pulling new migrations). refund-api has no
# migrations yet (T5 lands prisma/migrations/0001_init) — `db:deploy` against
# an empty migrations directory is a no-op, not an error, so this stays safe
# to run today.
#
# hours-api (specs/20261112-time-tracking) comes last: its `DATABASE_URL` (the `hours` database) comes from hours-api/.env,
# which a person creates (see the note above `dev`); without it, its `db:deploy` fails on the missing URL and the
# other nine databases are already migrated.
[tasks."db:migrate"]
description = "Apply DB migrations for auth + estimai-api + notify-api + refund-api + inventory-api + crm-api + meetings-api + projects-api + activities-api + accounting-api + letterhead-api + hours-api (needs backend env configured)"
run = """
docker compose up -d postgres
(cd auth && direnv exec . bun run db:deploy)
(cd estimai-api && direnv exec . bun run db:deploy)
(cd notify-api && direnv exec . bun run db:deploy)
(cd refund-api && direnv exec . bun run db:deploy)
(cd inventory-api && direnv exec . bun run db:deploy)
(cd crm-api && direnv exec . bun run db:deploy)
(cd meetings-api && direnv exec . bun run db:deploy)
(cd projects-api && direnv exec . bun run db:deploy)
(cd activities-api && direnv exec . bun run db:deploy)
# accounting-api: its logical database is made by the idempotent one-shot first (specs/20261119-accounting), then Prisma applies
# the init migration. Like letterhead's, so a fresh volume works whether or not `migrate deploy` would create the database itself.
docker compose run --rm accounting-createdb
(cd accounting-api && direnv exec . bun run db:deploy)
# letterhead-api (Rust): its logical database is made by the one-shot, then its own binary applies the embedded
# migrations (`letterhead-api migrate`; DATABASE_URL is the only variable it reads).
docker compose run --rm letterhead-createdb
(cd letterhead-api && DATABASE_URL="postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@localhost:5435/letterhead" cargo run -p letterhead-api -- migrate)
(cd hours-api && direnv exec . bun run db:deploy)
"""
# specs/20261117-legal-entities (T9): copy the CRM's legal details into the legal-entity registry (auth). LOCAL compose
# databases only: both URLs are built here from POSTGRES_* and never taken from the environment, so a production
# DATABASE_URL / CRM_DATABASE_URL exported in the shell cannot be reached through this task. It applies (`--apply`) and
# prints counts and field names, never a value. Run `mise run db:migrate` first (the registry table and the CRM's
# entity_profile must exist). The production runbook (dry run, apply, dry run, the gate) is infra/README.md.
[tasks."legal-entities:import"]
description = "Copy the CRM's legal details into the legal-entity registry — LOCAL compose databases, applies (production: infra/README.md runbook)"
run = """
set -e
export DATABASE_URL="postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@localhost:5435/operai_auth"
export CRM_DATABASE_URL="postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@localhost:5435/crm"
cd auth && bun run scripts/import-crm-legal-details.ts --apply
"""
