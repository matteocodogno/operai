[tools]
node = "24"

[hooks]
postinstall = "corepack enable pnpm && corepack use pnpm@latest-10"

[settings]
experimental = true

[tasks.release]
description = "Cut a release (conventional-changelog, git tag, GitHub release)"
run = "pnpm --package=release-it@^17 --package=@release-it/conventional-changelog@^8 dlx release-it"

# Run the WHOLE Operai suite locally (Module Federation, specs/003): Postgres +
# both backends + the three frontends, one command. Ports: auth 3001,
# estimai-api 8080, shell 5173, estimai-ui 5174, refund-ui 5175 (frontend ports
# pinned in each app's vite.config.ts). Open http://localhost:5173 (the shell).
# `trap 'kill 0'` reaps every child (backends + vite) on Ctrl-C. Postgres is
# left running (docker `up -d`, detached) — cheap to keep; `docker compose down`
# to stop it.
#
# Backend env: auth + estimai-api load their secrets from their own `.envrc`
# (direnv + 1Password). The `direnv exec .` wrappers below load `auth/.envrc` /
# `estimai-api/.envrc` explicitly — mise runs the task non-interactively, so
# direnv's shell hook does NOT fire on its own (without this, the backends fall
# back to placeholder creds and e.g. Google OAuth fails with `invalid_client`).
# Prereqs (once): direnv installed; each backend's .envrc allowed (`direnv allow
# auth`, `direnv allow estimai-api`); 1Password CLI signed in; ENABLE_TEST_AUTH=true
# for a seeded local session; and migrations applied via `mise run db:migrate`.
#
# HMR note: all-dev Module Federation works (verified — remotes mount, shared
# React singleton holds, no dup-React). Editing a remote's MF-EXPOSED root
# (estimai-ui/refund-ui src/App.tsx) triggers a full page reload rather than
# state-preserving Fast Refresh (the `__mf_remote_dependency_pending` export the
# federation plugin adds is incompatible with React Fast Refresh's
# consistent-exports rule); edits deeper in a remote's tree Fast-Refresh normally.
[tasks.dev]
description = "Run the FULL suite locally with HMR — Postgres + auth :3001 + estimai-api :8080 + shell :5173 + estimai-ui :5174 + refund-ui :5175"
run = """
docker compose up -d postgres
trap 'kill 0' EXIT INT TERM
(cd auth && direnv exec . bun run dev) &
(cd estimai-api && direnv exec . bun run dev) &
pnpm --dir shell dev &
pnpm --dir estimai-ui dev &
pnpm --dir refund-ui dev &
wait
"""

# Frontends only (HMR) — for when the backends are already running elsewhere
# (e.g. you started auth/estimai-api in their own terminals).
[tasks."dev:web"]
description = "Frontends only (HMR) — shell :5173 + estimai-ui :5174 + refund-ui :5175 (backends run separately)"
run = "trap 'kill 0' EXIT INT TERM; pnpm --dir shell dev & pnpm --dir estimai-ui dev & pnpm --dir refund-ui dev & wait"

# Full stack, but the frontends run build + preview instead of dev: no HMR, but
# deterministic and mirrors the Vercel deploy shape (independently built + served
# remotes) — the same mode the e2e uses (shell/playwright.config.ts). Builds gate
# the previews. Same prereqs + ports as `dev`.
[tasks."dev:preview"]
description = "Full suite, frontends build+preview (no HMR; mirrors deploy) — Postgres + auth + estimai-api + built frontends"
run = """
docker compose up -d postgres
pnpm --dir shell build && pnpm --dir estimai-ui build && pnpm --dir refund-ui build
trap 'kill 0' EXIT INT TERM
(cd auth && direnv exec . bun run dev) &
(cd estimai-api && direnv exec . bun run dev) &
pnpm --dir shell preview &
pnpm --dir estimai-ui preview &
pnpm --dir refund-ui preview &
wait
"""

# One-time / occasional: bring up Postgres and apply both backends' Prisma
# migrations (non-interactive `migrate deploy`). Run this before the first
# `mise run dev` (or after pulling new migrations).
[tasks."db:migrate"]
description = "Apply DB migrations for auth + estimai-api (needs backend env configured)"
run = """
docker compose up -d postgres
(cd auth && direnv exec . bun run db:deploy)
(cd estimai-api && direnv exec . bun run db:deploy)
"""